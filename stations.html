<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找附近優惠加油站|加油攻略</title>
<meta name="description" content="定位找出離你最近、有優惠適用的加油站。">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1c2733; --sub:#5b6b7b;
    --accent:#0f766e; --accent-soft:#e6f2f1; --warn:#b45309; --warn-soft:#fdf3e3;
    --line:#e3e8ee; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10151b; --card:#1a212a; --ink:#e8edf2; --sub:#9aa8b5;
      --accent:#2dd4bf; --accent-soft:#12332f; --warn:#fbbf24; --warn-soft:#332a12; --line:#2a3440; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:1.3rem;margin:0 0 4px}
  .sub{color:var(--sub);font-size:.88rem;margin-bottom:14px}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;
    background:var(--accent);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.6}
  .chips{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
  .chip{padding:5px 12px;border-radius:20px;border:1px solid var(--line);
    background:var(--card);color:var(--sub);font-size:.85rem;cursor:pointer}
  .chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 15px;margin-bottom:10px}
  .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .name{font-weight:700}
  .dist{color:var(--accent);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tags{margin:4px 0 6px}
  .tag{display:inline-block;font-size:.75rem;border-radius:6px;padding:1px 8px;margin-right:6px;
    background:var(--accent-soft);color:var(--accent);font-weight:600}
  .tag.warn{background:var(--warn-soft);color:var(--warn)}
  .addr{color:var(--sub);font-size:.85rem}
  .nav{font-size:.9rem;color:var(--accent);text-decoration:none;font-weight:700}
  .meta{color:var(--sub);font-size:.78rem;margin-top:20px;line-height:1.7}
  .back{color:var(--sub);font-size:.88rem;text-decoration:none}
  #status{color:var(--sub);font-size:.9rem;margin:12px 0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 回本週攻略</a>
  <h1 style="margin-top:10px">📍 找附近優惠加油站</h1>
  <div class="sub">定位後列出最近的加油站,標示本週優惠適用</div>

  <button class="btn" id="go">取得我的位置</button>
  <div id="status"></div>

  <div class="chips" id="chips" style="display:none">
    <span class="chip on" data-f="all">全部</span>
    <span class="chip" data-f="fpg">台塑體系(週三券)</span>
    <span class="chip" data-f="cpc-d">中油直營(中油Pay)</span>
    <span class="chip" data-f="self">可自助</span>
    <span class="chip" data-f="diesel">柴油車</span>
  </div>
  <div id="list"></div>

  <p class="meta" id="foot">
    優惠為品牌層級,各站實際牌價依現場公告為準。台塑體系站含台塑/台亞/福懋/山隆等經營者。<br>
    站點資料:中油開放資料、經濟部能源署;台塑體系座標為地理編碼推定,可能有誤差。
  </p>
</div>
<script>
const PROMOS = {
  "台塑體系": [{t:"週三APP券 滿25L抵15",w:1},{t:"台亞人工/自助優惠",w:0}],
  "中油直營": [{t:"中油Pay 最高6.8%",w:0},{t:"玉山卡回饋",w:0}],
  "中油加盟": []
};
let DATA=null, mypos=null, filter="all";
const $=s=>document.querySelector(s);

async function load(){
  if(DATA) return DATA;
  const r=await fetch("stations.json",{cache:"no-cache"});
  DATA=await r.json();
  $("#foot").innerHTML+=`<br>站點資料更新:${DATA.updated},共 ${DATA.stations.length} 站`;
  return DATA;
}
function hav(a,b,c,d){
  const R=6371,p=Math.PI/180,x=(c-a)*p/2,y=(d-b)*p/2;
  const h=Math.sin(x)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function render(){
  if(!mypos||!DATA) return;
  let st=DATA.stations;
  if(filter==="fpg") st=st.filter(s=>s.b==="台塑體系");
  if(filter==="cpc-d") st=st.filter(s=>s.b==="中油直營");
  if(filter==="self") st=st.filter(s=>s.self===1);
  if(filter==="diesel") st=st.filter(s=>s.d===1);
  const near=st.map(s=>({...s,d:hav(mypos[0],mypos[1],s.lat,s.lng)}))
    .sort((a,b)=>a.d-b.d).slice(0,10);
  $("#list").innerHTML=near.map(s=>{
    const promos=(PROMOS[s.b]||[]).map(p=>`<span class="tag${p.w?" warn":""}">${p.t}</span>`).join("");
    const selfTag=s.self===1?'<span class="tag">自助</span>':"";
    const dTag=s.d===1?(s.ds===1?'<span class="tag">柴油·可自助</span>':'<span class="tag">柴油</span>'):"";
    const pay=(s.pay||[]).map(p=>`<span class="tag">${p}</span>`).join("");
    const gmap=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.a)}`;
    return `<div class="card">
      <div class="row1"><span class="name">${s.n}<span style="font-weight:400;color:var(--sub);font-size:.85rem"> ${s.b}</span></span>
        <span class="dist">${s.d<1?(s.d*1000).toFixed(0)+" m":s.d.toFixed(1)+" km"}</span></div>
      <div class="tags">${promos}${selfTag}${dTag}${pay}</div>
      <div class="row1"><span class="addr">${s.a}${s.hours?"|"+s.hours:""}</span>
        <a class="nav" href="${gmap}" target="_blank">導航 ›</a></div>
    </div>`;
  }).join("")||"<p>此條件下附近沒有站點</p>";
}
$("#go").addEventListener("click",async()=>{
  $("#go").disabled=true;$("#status").textContent="定位中…";
  try{
    const [pos]=await Promise.all([
      new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:10000})),
      load()
    ]);
    mypos=[pos.coords.latitude,pos.coords.longitude];
    $("#status").textContent="";$("#chips").style.display="flex";
    render();
  }catch(e){
    $("#status").textContent="定位失敗:請確認已允許位置權限("+ (e.message||e.code||"") +")";
  }
  $("#go").disabled=false;
});
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on");filter=c.dataset.f;render();
}));
</script>
</body>
</html>
